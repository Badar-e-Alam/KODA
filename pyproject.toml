[project]
name = "koda"
version = "0.3.1"
description = "KODA — agent-agnostic AI coding TUI"
requires-python = ">=3.11"

dependencies = [
    # Phase 1: TUI still runs on deepagents-cli; Phase 2 will drop it.
    "deepagents-cli>=0.0.37",
    "python-dotenv>=1.0.0",
    "langchain>=0.3",
    "langchain-core>=0.3",
    "langgraph>=0.3",
    "httpx>=0.27",
]

[project.optional-dependencies]
# Summarizer model backends (install the ones you use)
anthropic = ["langchain-anthropic"]
openai = ["langchain-openai"]
ollama = ["langchain-ollama"]
google = ["langchain-google-genai"]
all = [
    "langchain-anthropic",
    "langchain-openai",
    "langchain-ollama",
    "langchain-google-genai",
]

[project.scripts]
koda = "koda.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
