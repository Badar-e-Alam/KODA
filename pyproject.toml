[project]
name = "koda"
version = "0.4.0"
description = "KODA — agent-agnostic AI coding TUI"
requires-python = ">=3.11"

dependencies = [
    "textual>=0.60",
    "python-dotenv>=1.0.0",
    "langchain>=0.3",
    "langchain-core>=0.3",
    "langgraph>=0.3",
    "httpx>=0.27",
    "pyperclip>=1.8",
]

[project.optional-dependencies]
# Summarizer model backends (install the ones you use)
anthropic = ["langchain-anthropic"]
openai = ["langchain-openai"]
ollama = ["langchain-ollama"]
google = ["langchain-google-genai"]
all = [
    "langchain-anthropic",
    "langchain-openai",
    "langchain-ollama",
    "langchain-google-genai",
]

[project.scripts]
koda = "koda.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
