<svg xmlns="http://www.w3.org/2000/svg" width="720" height="620" font-family="'Cascadia Code','Fira Code','JetBrains Mono','Consolas',monospace" font-size="13">
  <rect width="720" height="620" rx="10" fill="#1a1b26"/>
  <!-- Window dots -->
  <circle cx="24" cy="18" r="6" fill="#ff5f57"/>
  <circle cx="44" cy="18" r="6" fill="#febc2e"/>
  <circle cx="64" cy="18" r="6" fill="#28c840"/>
  <!-- Banner eyes -->
  <text x="265" y="62" fill="#00b894" font-weight="bold">╭────────╮</text>
  <text x="265" y="78" fill="#00b894" font-weight="bold">│ <tspan fill="#fff">●    ●</tspan> │</text>
  <text x="265" y="94" fill="#00b894" font-weight="bold">╰────────╯</text>
  <!-- KODA block letters -->
  <text x="140" y="126" fill="#00b894" font-weight="bold">██╗  ██╗  ██████╗  ██████╗   █████╗</text>
  <text x="140" y="142" fill="#00b894" font-weight="bold">██║ ██╔╝ ██╔═══██╗ ██╔══██╗ ██╔══██╗</text>
  <text x="140" y="158" fill="#00b894" font-weight="bold">█████╔╝  ██║   ██║ ██║  ██║ ███████║</text>
  <text x="140" y="174" fill="#00b894" font-weight="bold">██╔═██╗  ██║   ██║ ██║  ██║ ██╔══██║</text>
  <text x="140" y="190" fill="#00b894" font-weight="bold">██║  ██╗ ╚██████╔╝ ██████╔╝ ██║  ██║</text>
  <text x="140" y="206" fill="#00b894" font-weight="bold">╚═╝  ╚═╝  ╚═════╝  ╚═════╝  ╚═╝  ╚═╝</text>
  <!-- Tagline -->
  <text x="190" y="236" fill="#666" font-size="12">your AI companion in the terminal</text>
  <!-- Separator -->
  <line x1="24" y1="260" x2="696" y2="260" stroke="#2a2b3d" stroke-width="1"/>
  <!-- User message -->
  <text x="24" y="290" fill="#ccc" font-weight="bold">❯</text>
  <text x="42" y="290" fill="#ccc">read the config and fix the bug</text>
  <!-- Assistant label -->
  <text x="24" y="324" fill="#00b894" font-weight="bold">◆ DEEP-AGENT</text>
  <!-- Thinking -->
  <text x="48" y="348" fill="#666" font-style="italic" font-size="12">thinking... analyzing the request</text>
  <!-- Tool call 1 - running then done -->
  <text x="48" y="378" fill="#f1c40f">⏵</text>
  <text x="66" y="378" fill="#ccc" font-weight="bold">read_file</text>
  <text x="152" y="378" fill="#666" font-size="12">path="config.py"</text>
  <!-- Tool result -->
  <text x="72" y="398" fill="#555" font-size="11">def connect():</text>
  <text x="72" y="414" fill="#555" font-size="11">    host = os.getenv("DB_HOST")</text>
  <text x="72" y="430" fill="#555" font-size="11">    port = None  # BUG: should be 5432</text>
  <!-- Tool call 2 - done -->
  <text x="48" y="460" fill="#00b894">✓</text>
  <text x="66" y="460" fill="#ccc" font-weight="bold">edit_file</text>
  <text x="152" y="460" fill="#666" font-size="12">path="config.py" line=42</text>
  <text x="72" y="480" fill="#555" font-size="11">Applied 1 change</text>
  <!-- Response text -->
  <text x="48" y="510" fill="#ccc">Found the bug on line 42 — port was</text>
  <text x="48" y="528" fill="#ccc"><tspan fill="#e2e8f0" font-family="monospace">None</tspan> instead of <tspan fill="#e2e8f0" font-family="monospace">5432</tspan>. Fixed it.</text>
  <!-- Status bar -->
  <rect x="0" y="558" width="720" height="28" fill="#14151f"/>
  <line x1="0" y1="558" x2="720" y2="558" stroke="#2a2b3d" stroke-width="1"/>
  <text x="24" y="577" fill="#00b894" font-size="12" font-weight="bold">◉</text>
  <text x="40" y="577" fill="#888" font-size="12">KODA</text>
  <text x="80" y="577" fill="#444" font-size="12">·</text>
  <text x="92" y="577" fill="#888" font-size="12">deep-agent</text>
  <text x="172" y="577" fill="#444" font-size="12">·</text>
  <text x="184" y="577" fill="#888" font-size="12">openai:gpt-4o</text>
  <text x="296" y="577" fill="#444" font-size="12">·</text>
  <text x="308" y="577" fill="#888" font-size="12">2 msgs</text>
  <text x="360" y="577" fill="#444" font-size="12">·</text>
  <text x="372" y="577" fill="#888" font-size="12">521 tokens</text>
  <text x="452" y="577" fill="#444" font-size="12">·</text>
  <text x="464" y="577" fill="#888" font-size="12">$0.0031</text>
  <!-- Input bar -->
  <rect x="0" y="588" width="720" height="32" fill="#1a1b26"/>
  <line x1="0" y1="588" x2="720" y2="588" stroke="#2a2b3d" stroke-width="1"/>
  <text x="24" y="610" fill="#444" font-size="12">Message KODA... (/ for commands)</text>
</svg>
